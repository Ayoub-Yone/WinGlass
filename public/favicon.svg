<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>WinGlass</title>
  <!-- Spatial Glass Tiles: master for every app icon (`npx tauri icon public/favicon.svg`). -->
  <defs>
    <linearGradient id="slate" x1="0" y1="0" x2="0.25" y2="1">
      <stop offset="0" stop-color="#2c323b"/>
      <stop offset="1" stop-color="#0f1217"/>
    </linearGradient>
    <radialGradient id="backlight" cx="0.5" cy="0.44" r="0.46">
      <stop offset="0" stop-color="#8fdcff" stop-opacity="0.42"/>
      <stop offset="0.55" stop-color="#6f8dff" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#6f8dff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.26"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.10"/>
    </linearGradient>
    <linearGradient id="pane" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.80"/>
      <stop offset="0.5" stop-color="#e6f5ff" stop-opacity="0.46"/>
      <stop offset="1" stop-color="#cbe4ff" stop-opacity="0.30"/>
    </linearGradient>
    <radialGradient id="gloss" cx="0.28" cy="0" r="0.85">
      <stop offset="0" stop-color="#fff" stop-opacity="0.55"/>
      <stop offset="0.55" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="0.45" stop-color="#c4f3ff" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.22"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <rect id="t" width="252" height="252" rx="58"/>
    <!-- the drop shadow stops at the pane, so the glass stays clear instead of smoked -->
    <mask id="outside" maskUnits="userSpaceOnUse" x="-120" y="-120" width="500" height="500">
      <rect x="-120" y="-120" width="500" height="500" fill="#fff"/>
      <use xlink:href="#t" fill="#000"/>
    </mask>
    <g id="tile">
      <g mask="url(#outside)"><use xlink:href="#t" transform="translate(0 22)" fill="#000" fill-opacity="0.55" filter="url(#soft)"/></g>
      <use xlink:href="#t" fill="url(#pane)"/>
      <use xlink:href="#t" fill="url(#gloss)"/>
      <!-- chromatic edge glint: cyan up-left, rose down-right, under the specular rim -->
      <use xlink:href="#t" transform="translate(-3 -3)" fill="none" stroke="#7ff1ff" stroke-opacity="0.55" stroke-width="4"/>
      <use xlink:href="#t" transform="translate(3 3)" fill="none" stroke="#ff9fd8" stroke-opacity="0.32" stroke-width="4"/>
      <use xlink:href="#t" fill="none" stroke="url(#edge)" stroke-width="7"/>
    </g>
  </defs>
  <rect x="16" y="16" width="992" height="992" rx="228" fill="url(#slate)"/>
  <rect x="16" y="16" width="992" height="992" rx="228" fill="url(#backlight)"/>
  <rect x="18" y="18" width="988" height="988" rx="226" fill="none" stroke="url(#rim)" stroke-width="4"/>
  <use xlink:href="#tile" x="238" y="238"/>
  <use xlink:href="#tile" x="534" y="238"/>
  <use xlink:href="#tile" x="238" y="534"/>
  <use xlink:href="#tile" x="534" y="534"/>
</svg>
