[package]
name = "winglass"
version = "0.6.2"
description = "Floating smart widget dock for Windows"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "winglass_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.42.0", features = ["bundled"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "sync"] }
chrono = { version = "0.4.45", features = ["serde"] }
ical = "0.11.0"
base64 = "0.23.1"
once_cell = "1.21.4"
parking_lot = "0.13.0"
image = { version = "0.25.10", default-features = false, features = ["png"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "gzip", "http2", "query", "form", "system-proxy"] }
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_HiDpi", "Win32_Graphics_Gdi", "Win32_Storage_Xps", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dwm", "Win32_Security", "Win32_Security_Cryptography", "Win32_System_Com", "Win32_System_Console", "Win32_System_Threading", "Win32_System_ProcessStatus", "Win32_System_SystemInformation", "Win32_System_Power", "Win32_System_Shutdown", "Win32_System_Environment", "Win32_System_Memory", "Win32_System_LibraryLoader", "Win32_System_Diagnostics_Debug", "Win32_System_Registry", "Win32_System_Ole", "Win32_System_Variant", "Win32_System_Wmi", "Win32_Storage_FileSystem", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock", "Win32_UI_Shell_Common", "Win32_UI_Shell_PropertiesSystem", "Win32_System_Performance", "Foundation", "Foundation_Collections", "Media_Control", "Storage_Streams", "Devices_Radios", "Networking_Connectivity", "Networking_NetworkOperators", "Win32_System_WinRT", "Win32_UI_Accessibility", "Win32_Devices_Display", "Win32_Globalization", "Win32_System_Rpc", "Win32_System_Diagnostics_ToolHelp", "Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_System_Com_StructuredStorage"] }
chrono-tz = "0.10.4"
windows-core = "0.62.2"
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
# Unwinding (not abort) so the panic hook and drop guards can restore the Windows taskbar.
panic = "unwind"
strip = true

[features]
# `cargo build --release` must embed the frontend (custom protocol) rather than expect the Vite dev
# server. `tauri dev` runs with --no-default-features, so development still gets hot reload.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
